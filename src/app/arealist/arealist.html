<p>arealist works!</p>

<div style="text-align: right;"><button (click)="AddArea()">Add Area</button></div>

<table border="1" style="border-collapse: collapse; width:100%; table-layout:fixed;">
    <thead>
        <tr>
            <th style="width:10%; text-align:left;">Sr No</th>
            <th style="width:20%; text-align:left;">Area Code</th>
            <th style="width:25%; text-align:left;">Area Name</th>
            <th style="width:25%; text-align:left;">City Name</th>
            <th style="width:25%; text-align:left;">State Name</th>
            <th style="width:30%; text-align:center;">Action</th>
        </tr>
    </thead>

    <tbody>
        @for (item of areas(); track $index) {
         
        <tr>
            <td>{{$index + 1}}</td>
            <td>{{item.AreaCode}}</td>
            <td>{{item.AreaName}}</td>
            <td>{{item.CityName}}</td>
            <td>{{item.StateName}}</td>
            <td style="text-align:center;">
                <i class="bi bi-pencil-square action-icon edit"
                   title="Edit" (click)="editArea(item.AreaId)">
                </i>
                <i class="bi bi-trash-fill action-icon delete"
                   title="Delete" (click)="deleteArea(item.AreaId)">
                </i>
           </td>
        </tr>
       }
    </tbody>
</table>
