<p>viewenquiry works!</p>
<div class="card shadow-sm border-0">

        <div class="card-header bg-white py-3">
            <h5 class="mb-0">
                <i class="bi bi-person-lines-fill me-2"></i>
                View Enquiry 
            </h5>
        </div>
</div>  

<table>
  <tr>
    <td>
        Enquiry No.
    </td>
    <td>
       <input type="text" [(ngModel)]="enquiryData().EnquiryNo">
    </td>
  </tr>

    <tr>
    <td>
        Enquiry Date
    </td>
    <td>
       <input type="text" [(ngModel)]="enquiryData().EnquiryDate">
    </td>
  </tr>

  <tr>
    <td>
        Customer Name
    </td>
    <td>
       <input type="text" [(ngModel)]="enquiryData().CustomerName">
    </td>
  </tr>

  <tr>
    <td>
        Customer Address
    </td>
    <td>
       <input type="text" [(ngModel)]="enquiryData().CustomerAddress">
    </td>
  </tr>

  <tr>
    <td>
        Mobile Number
    </td>
    <td>
       <input type="text" [(ngModel)]="enquiryData().PhoneNo">
    </td>
  </tr>

  <tr>
    <td>
        Email
    </td>
    <td>
       <input type="text" [(ngModel)]="enquiryData().EmailAdd">
    </td>
  </tr>

</table>
